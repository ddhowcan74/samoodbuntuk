<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EAE7DE">
<title>สมุดพกส่วนตัว — DEV</title>
<style>
:root{--paper:#eae7de;--card:#f8f6ee;--ink:#262920;--muted:#74766d;--line:#d4d0c2;--money:#3f6b52;--food:#b0562a;--weight:#4b4e93}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif}
.app{max-width:760px;margin:auto;padding:18px 16px 90px}.top{position:sticky;top:0;z-index:5;background:rgba(234,231,222,.94);backdrop-filter:blur(10px);padding:8px 0 14px}.title{text-align:center;font-weight:800;font-size:20px}.sub{color:var(--muted);font-size:13px;text-align:center;margin-top:3px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.tab{border:0;background:transparent;padding:12px 4px;border-bottom:3px solid transparent;font-weight:700;color:var(--muted);cursor:pointer}.tab.active{color:var(--ink);border-color:var(--accent)}
h1{font-family:Georgia,"Noto Serif Thai",serif;font-size:34px;margin:22px 0 4px}.date{color:var(--muted);margin-bottom:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 2px 8px rgba(30,30,20,.03)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{min-height:100px}.label{color:var(--muted);font-size:14px}.big{font-size:30px;font-weight:800;margin-top:8px}.section-title{font-family:Georgia,"Noto Serif Thai",serif;font-size:23px;font-weight:800;margin:0 0 16px}.section-title:before{content:"";display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--accent);margin-right:10px}
label{display:block;color:var(--muted);font-size:14px;margin:12px 0 6px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:#efede5;color:var(--ink);padding:13px;font-size:16px;outline:none}textarea{min-height:80px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent)}
button.primary{width:100%;border:0;border-radius:13px;background:var(--accent);color:white;padding:14px;font-size:17px;font-weight:800;margin-top:14px;cursor:pointer}.ghost{border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 11px;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.entry{padding:13px 0;border-bottom:1px solid var(--line)}.entry:last-child{border-bottom:0}.amount{font-weight:800}.income{color:var(--money)}.expense{color:var(--food)}
.pill{display:inline-block;border-radius:999px;padding:4px 8px;background:#e5e1d6;color:var(--muted);font-size:12px}.note{margin-top:8px;color:var(--muted);font-size:14px;white-space:pre-wrap}.hidden{display:none}.bar{height:10px;background:#dfdcd1;border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}.empty{text-align:center;color:var(--muted);padding:24px 8px}.hint{font-size:13px;color:var(--muted);line-height:1.55}.estimate{border:1px dashed #c9c4b5;border-radius:14px;padding:13px;margin-top:14px;background:#f1eee5}.estimate strong{font-size:22px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#efede5;border-radius:999px;padding:8px 11px;font-size:14px;cursor:pointer}.chip.active{border-color:var(--food);background:#ead8ce}.food-details{border-top:1px solid var(--line);margin-top:14px;padding-top:10px}
.quick{position:fixed;right:18px;bottom:20px;width:58px;height:58px;border-radius:50%;border:0;background:var(--ink);color:white;font-size:28px;box-shadow:0 8px 24px #0002}
.date3{display:grid;grid-template-columns:1fr 1fr 1.55fr;gap:8px}.date3-part{position:relative}.date3-part input{height:64px;text-align:center;font-size:27px;font-weight:800;padding:8px 6px;font-variant-numeric:tabular-nums}.date3-part label{margin:5px 0 0;text-align:center;font-size:11px}.date3-part input::-webkit-inner-spin-button{opacity:1}
@media(max-width:520px){.grid2{grid-template-columns:1fr 1fr}.app{padding-left:12px;padding-right:12px}h1{font-size:31px}.card{border-radius:18px;padding:16px}.date3{gap:6px}.date3-part input{font-size:24px;padding-left:3px;padding-right:3px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="title">สมุดพกส่วนตัว</div><div class="sub">บันทึกชีวิตประจำวันในที่เดียว</div>
<nav class="tabs" id="tabs">
<button class="tab active" data-page="home">วันนี้</button><button class="tab" data-page="money">การเงิน</button><button class="tab" data-page="food">แคลอรี่</button><button class="tab" data-page="weight">น้ำหนัก</button>
</nav></header>
<main id="content"></main>
</div>
<button class="quick" id="quick" title="เพิ่มรายการ">+</button>
<script>
const KEY="personalPocketV1";
const APP_VERSION="2.0.0-dev";
// DEV build: changes here are for testing only. Promote to production only after user confirmation.
let db=JSON.parse(localStorage.getItem(KEY)||'{"balance":null,"transactions":[],"foods":[],"weights":[],"height":null,"calGoal":2000}');
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const money=n=>new Intl.NumberFormat("th-TH",{maximumFractionDigits:2}).format(n);
const today=()=>new Date().toISOString().slice(0,10);
function dateParts(iso){const d=new Date((iso||today())+"T00:00:00");return {day:d.getDate(),month:d.getMonth()+1,year:d.getFullYear()+543};}
function daysInMonth(m,y){return new Date(y,m,0).getDate();}
function dateField(id,iso){const p=dateParts(iso);return `<div class="date3" data-date-field="${id}"><div class="date3-part"><input id="${id}d" type="number" min="1" max="31" value="${p.day}" inputmode="numeric"><label>วัน</label></div><div class="date3-part"><input id="${id}m" type="number" min="1" max="12" value="${p.month}" inputmode="numeric"><label>เดือน</label></div><div class="date3-part"><input id="${id}y" type="number" min="2400" max="2700" value="${p.year}" inputmode="numeric"><label>ปี พ.ศ.</label></div><input id="${id}" type="hidden" value="${iso||today()}"></div>`;}
function initDateFields(){document.querySelectorAll("[data-date-field]").forEach(box=>{if(box.dataset.ready==="1")return;box.dataset.ready="1";const id=box.dataset.dateField;const sync=()=>{let d=Math.min(31,Math.max(1,Number(document.getElementById(id+"d").value)||1));let m=Math.min(12,Math.max(1,Number(document.getElementById(id+"m").value)||1));let by=Math.max(2400,Number(document.getElementById(id+"y").value)||2569);const gy=by-543;d=Math.min(d,daysInMonth(m,gy));document.getElementById(id+"d").value=d;document.getElementById(id).value=`${String(gy).padStart(4,"0")}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;};box.querySelectorAll('input[type="number"]').forEach(x=>x.addEventListener("change",sync));sync();if(id==="fdview")box.querySelectorAll('input[type="number"]').forEach(x=>x.addEventListener("change",()=>{db.foodViewDate=document.getElementById(id).value;save();pageFood();}));});}
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const fmtDate=d=>new Date(d+"T00:00:00").toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"numeric"});
// Calorie estimation model: portion-first, not body-weight-first.
// The model uses Thai/US food-composition concepts (per-100g + household portions),
// then widens the estimate when cooking oil, portion size, or recipe details are uncertain.
const foodDB={
 "ข้าวไข่เจียวหมูสับ":{base:620,range:[520,780],components:{rice:180,egg:2,pork:60,veg:25,oil:12}},
 "ข้าวกะเพราหมูสับ":{base:600,range:[500,760],components:{rice:180,pork:70,veg:40,oil:12}},
 "ข้าวผัดกุนเชียง":{base:650,range:[540,820],components:{rice:220,sausage:50,egg:1,veg:30,oil:12}},
 "ข้าวมันไก่":{base:600,range:[500,760],components:{rice:220,chicken:90,oil:8}},
 "ก๋วยเตี๋ยวหมู":{base:450,range:[350,600],components:{noodle:180,pork:60,veg:40,oil:5}},
 "ข้าวต้มหมู":{base:350,range:[280,500],components:{rice:180,pork:50,veg:30,oil:3}}
};
const kcalPer={rice:1.30,egg:72,pork:2.5,veg:.30,oil:8.84,chicken:1.8,sausage:4.2,noodle:1.4};
function firstNum(text,patterns){for(const re of patterns){const m=text.match(re);if(m)return Number(m[1]);}return null}
function parseFoodDetails(text, base){
 const t=(text||'').toLowerCase(); const c={...(base?.components||{})};
 const riceG=firstNum(t,[/(?:ข้าว|ข้าวสวย)[^0-9]{0,12}(\d+(?:\.\d+)?)\s*(?:กรัม|g)/,/(\d+(?:\.\d+)?)\s*(?:กรัม|g)[^\n]{0,8}(?:ข้าว)/]); if(riceG)c.rice=riceG;
 const eggs=firstNum(t,[/(?:ไข่|ไข่ไก่)\s*(\d+(?:\.\d+)?)\s*(?:ฟอง|ใบ)/]); if(eggs)c.egg=eggs;
 const pork=firstNum(t,[/(?:หมูสับ|หมู)[^0-9]{0,12}(\d+(?:\.\d+)?)\s*(?:กรัม|g)/]); if(pork)c.pork=pork;
 const oil=firstNum(t,[/(?:น้ำมัน)[^0-9]{0,12}(\d+(?:\.\d+)?)\s*(?:กรัม|g|ช้อนชา|ชช)/]); if(oil)c.oil=oil;
 if(/ข้าว\s*(?:เยอะ|เยอะมาก|กองใหญ่|ให้เยอะ)/.test(t)) c.rice=Math.max(c.rice||180,250);
 if(/ข้าว\s*(?:น้อย|นิดเดียว)/.test(t)) c.rice=Math.min(c.rice||180,130);
 if(/ไข่\s*(?:ฟองเดียว|1\s*ฟอง)/.test(t)) c.egg=1;
 if(/ไข่\s*(?:เยอะ|หลายฟอง)/.test(t)) c.egg=Math.max(c.egg||2,3);
 if(/หมูสับ\s*(?:เยอะ|เยอะมาก)/.test(t)) c.pork=Math.max(c.pork||60,90);
 if(/หมูสับ\s*(?:น้อย|นิดเดียว)/.test(t)) c.pork=Math.min(c.pork||60,35);
 if(/น้ำมัน\s*(?:เยอะ|มาก|ทอดน้ำมันท่วม)/.test(t)) c.oil=Math.max(c.oil||12,22);
 if(/น้ำมัน\s*(?:น้อย|นิดเดียว)/.test(t)) c.oil=Math.min(c.oil||12,6);
 if(/ผัก[^\n]{0,20}(?:เยอะ|มาก)/.test(t)) c.veg=Math.max(c.veg||25,60);
 if(/ผัก[^\n]{0,20}(?:น้อย|นิดเดียว)/.test(t)) c.veg=Math.min(c.veg||25,10);
 return c;
}
function estimate(name,qty,details=''){
 const key=Object.keys(foodDB).find(x=>name.trim().includes(x)||x.includes(name.trim()));
 const b=key?foodDB[key]:{base:500,range:[400,700],components:{rice:180,pork:50,veg:30,oil:8}};
 const q=Math.max(.1,Number(qty)||1); const c=parseFoodDetails(details,b);
 let k=0; for(const [part,g] of Object.entries(c)){ if(part==='egg') k+=g*kcalPer.egg; else if(kcalPer[part]) k+=g*kcalPer[part]; }
 if(!k) k=b.base*q; else k*=q;
 // Text such as “อิ่ม/ได้เยอะ” is used only as a portion-confidence clue, never as a direct calorie multiplier.
 const fullness=/อิ่มมาก|อิ่มจน|แน่นมาก|แทบอิ่ม/.test(details)?'large':/อิ่ม|พอดี|ได้เยอะ|จานใหญ่|จานโต/.test(details)?'normal':'unknown';
 let spread=fullness==='large'?1.12:fullness==='normal'?1.05:1.15;
 const lo=Math.max(0,Math.round(k/spread)), hi=Math.round(k*spread);
 const rangeLo=Math.max(Math.round(b.range[0]*q),lo), rangeHi=Math.max(Math.round(b.range[1]*q),hi);
 return {name:name.trim(),qty:q,k:Math.round(k),low:rangeLo,high:rangeHi,p:Math.round((k*.16)/4),c:Math.round((k*.52)/4),f:Math.round((k*.32)/9),details,components:c,confidence:details?'ปรับจากรายละเอียดที่ให้':'ประเมินจากเมนูมาตรฐาน'};
}
function pageHome(){
 const inc=db.transactions.filter(x=>x.type==="in"&&x.date===today()).reduce((a,x)=>a+x.amount,0);
 const out=db.transactions.filter(x=>x.type==="out"&&x.date===today()).reduce((a,x)=>a+x.amount,0);
 const kcal=db.foods.filter(x=>x.date===today()).reduce((a,x)=>a+x.k,0);
 const last=[...db.transactions.map(x=>({...x,kind:"เงิน"})),...db.foods.map(x=>({...x,kind:"อาหาร"})),...db.weights.map(x=>({...x,kind:"น้ำหนัก"}))].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
 document.getElementById("content").innerHTML=`<h1>วันนี้</h1><div class="date">${fmtDate(today())}</div>
 <div class="grid2"><div class="card stat"><div class="label">ยอดเงินคงเหลือ</div><div class="big">${db.balance===null?"—":money(currentBalance())} ฿</div></div>
 <div class="card stat"><div class="label">แคลอรี่วันนี้</div><div class="big">${money(kcal)}</div><div class="label">จาก ${money(db.calGoal)} kcal</div></div></div>
 <div class="grid2"><div class="card stat"><div class="label">รายรับวันนี้</div><div class="big income">+${money(inc)}</div></div><div class="card stat"><div class="label">รายจ่ายวันนี้</div><div class="big expense">-${money(out)}</div></div></div>
 <div class="card"><div class="section-title" style="--accent:#555">รายการล่าสุด</div>${last.length?last.map(x=>`<div class="entry"><div class="row"><b>${esc(x.name||x.kind)}</b><span class="pill">${fmtDate(x.date)}</span></div><div class="label">${x.kind==="เงิน"?(x.type==="in"?"+":"-")+money(x.amount)+" ฿":x.kind==="อาหาร"?x.k+" kcal":x.kg+" kg"}</div></div>`).join(""):"<div class='empty'>ยังไม่มีข้อมูล</div>"}</div>`;
}
function currentBalance(){if(db.balance===null)return 0;return db.balance.amount+db.transactions.filter(x=>x.date>=db.balance.date).reduce((s,x)=>s+(x.type==="in"?x.amount:-x.amount),0);}
function pageMoney(){
 const list=[...db.transactions].sort((a,b)=>b.date.localeCompare(a.date));
 document.getElementById("content").innerHTML=`<h1>การเงิน</h1><div class="date">ติดตามเงินเข้าออกและยอดคงเหลือ</div>
 <div class="card" style="--accent:var(--money)"><div class="section-title">ยอดเงินปัจจุบัน</div><div class="big">${db.balance===null?"—":money(currentBalance())} ฿</div>
 <div class="label">${db.balance===null?"ตั้งยอดเงินเริ่มต้นเพื่อให้ระบบคำนวณ":"คำนวณจากยอดตั้งต้น + รายการหลังวันที่ตั้งต้น"}</div>
 <label>ยอดเงินตั้งต้น ณ วันที่</label><div class="grid2"><input id="bal" type="number" placeholder="เช่น 10000" value="${db.balance?.amount??""}">${dateField("baldate",db.balance?.date??today())}</div>
 <button class="primary" onclick="setBalance()">บันทึกยอดตั้งต้น</button></div>
 <div class="card" style="--accent:var(--money)"><div class="section-title">บันทึกรายการ</div><div class="grid2"><div><label>ประเภท</label><select id="tt"><option value="out">รายจ่าย</option><option value="in">รายรับ</option></select></div><div><label>จำนวนเงิน</label><input id="amt" type="number" inputmode="decimal" placeholder="0"></div></div>
 <label>รายการ</label><input id="tn" placeholder="เช่น ค่าอาหาร">
 <label>วันที่</label>${dateField("td",today())}
 <label>หมวดหมู่</label><select id="tc"><option>อาหาร</option><option>เดินทาง</option><option>ที่พัก/บิล</option><option>ช้อปปิ้ง</option><option>งาน</option><option>อื่นๆ</option></select>
 <label>บันทึกย่อ (ไม่บังคับ)</label><textarea id="note" placeholder="เกิดอะไรขึ้นกับรายการนี้..."></textarea><button class="primary" onclick="addTx()">บันทึกรายการ</button></div>
 <div class="card" style="--accent:var(--money)"><div class="section-title">รายการทั้งหมด</div>${list.length?list.map((x,i)=>`<div class="entry"><div class="row"><b>${esc(x.name)}</b><span class="amount ${x.type==="in"?"income":"expense"}">${x.type==="in"?"+":"-"}${money(x.amount)} ฿</span></div><div class="label">${fmtDate(x.date)} · ${esc(x.cat)} ${x.note?`· <button class="ghost" onclick="toggleNote(${i})">ดูบันทึกย่อ</button>`:""}</div><div id="note${i}" class="note hidden">${esc(x.note||"")}</div></div>`).join(""):"<div class='empty'>ยังไม่มีรายการ</div>"}</div>`;
}
function setBalance(){const amount=Number(document.getElementById("bal").value);if(!Number.isFinite(amount))return alert("กรอกยอดเงินก่อน");db.balance={amount,date:document.getElementById("baldate").value};save();pageMoney();}
function addTx(){const amount=Number(document.getElementById("amt").value),name=document.getElementById("tn").value.trim();if(!amount||!name)return alert("กรอกจำนวนเงินและรายการ");db.transactions.push({id:Date.now(),type:document.getElementById("tt").value,amount,name,date:document.getElementById("td").value,cat:document.getElementById("tc").value,note:document.getElementById("note").value});save();pageMoney();}
function toggleNote(i){document.getElementById("note"+i).classList.toggle("hidden")}
function previewFood(){
 const name=document.getElementById('fn')?.value.trim()||''; const qty=document.getElementById('fq')?.value||1; const details=document.getElementById('fd')?.value||'';
 if(!name){document.getElementById('foodPreview').innerHTML='<div class="hint">พิมพ์ชื่ออาหารก่อน ระบบจะช่วยประเมินให้</div>';return}
 const x=estimate(name,qty,details);
 document.getElementById('foodPreview').innerHTML=`<div class="estimate"><div class="label">ประมาณการจากข้อมูลที่ให้</div><strong>${x.k.toLocaleString('th-TH')} kcal</strong><div class="hint">ช่วงที่เป็นไปได้ประมาณ ${x.low.toLocaleString('th-TH')}–${x.high.toLocaleString('th-TH')} kcal · ${esc(x.confidence)}</div><div class="hint">ยังไม่ควรตีความว่าเป็นค่าที่แม่นยำ เพราะขนาดจาน สูตร และน้ำมันจริงเปลี่ยนได้มาก</div></div>`;
}
function pageFood(){
 const selectedDate=db.foodViewDate||today(); db.foodViewDate=selectedDate;
 const total=db.foods.filter(x=>x.date===selectedDate).reduce((a,x)=>a+x.k,0), pct=Math.min(100,total/db.calGoal*100);
 const list=db.foods.filter(x=>x.date===selectedDate);
 document.getElementById("content").innerHTML=`<h1>แคลอรี่</h1><div class="date">${dateField("fdview",selectedDate)}</div>
 <div class="card" style="--accent:var(--food)"><div class="row"><div><div class="label">วันนี้</div><div class="big">${money(total)} <small>kcal</small></div></div><div class="label">เป้าหมาย ${money(db.calGoal)}</div></div><div class="bar" style="margin-top:16px"><i style="width:${pct}%"></i></div><label>เป้าหมายต่อวัน</label><input id="goal" type="number" value="${db.calGoal}"><button class="ghost" onclick="setGoal()" style="margin-top:8px">บันทึกเป้าหมาย</button></div>
 <div class="card" style="--accent:var(--food)"><div class="section-title">เพิ่มรายการอาหาร</div><label>ชื่ออาหาร</label><input id="fn" placeholder="เช่น ข้าวไข่เจียวหมูสับ" oninput="previewFood()">
 <div class="grid2"><div><label>จำนวนชุด</label><input id="fq" type="number" min=".1" step=".1" value="1" oninput="previewFood()"></div><div><label>หน่วย</label><select id="fu"><option>จาน</option><option>ชาม</option><option>กล่อง</option><option>แก้ว</option><option>ชิ้น</option></select></div></div>
 <label>รายละเอียดเพิ่มเติม <span class="label">(ไม่ต้องเป๊ะ)</span></label><textarea id="fd" placeholder="เช่น ข้าวเยอะ ไข่ 2 ฟอง หมูสับประมาณ 60 กรัม ผักนิดหน่อย น้ำมันไม่เยอะ กินแล้วอิ่มพอดี" oninput="previewFood()"></textarea>
 <div class="chips" style="margin-top:8px"><button class="chip" onclick="addFoodHint('ข้าวเยอะ')">ข้าวเยอะ</button><button class="chip" onclick="addFoodHint('ไข่ 2 ฟอง')">ไข่ 2 ฟอง</button><button class="chip" onclick="addFoodHint('หมูสับเยอะ')">หมูเยอะ</button><button class="chip" onclick="addFoodHint('น้ำมันน้อย')">น้ำมันน้อย</button><button class="chip" onclick="addFoodHint('ผักนิดหน่อย')">ผักนิดหน่อย</button><button class="chip" onclick="addFoodHint('อิ่มพอดี')">อิ่มพอดี</button></div>
 <div id="foodPreview"><div class="hint">ระบบจะใช้ชื่ออาหาร + จำนวน + รายละเอียด เพื่อปรับประมาณการให้ละเอียดขึ้น</div></div>
 <button class="primary" onclick="addFood()">เพิ่มรายการ</button></div>
 <div class="card" style="--accent:var(--food)"><div class="section-title">รายการวันนี้</div>${list.length?list.map((x,i)=>`<div class="entry"><div class="row"><b>${esc(x.name)}</b><b>${x.k} kcal</b></div><div class="label">${x.qty} ${esc(x.unit||'จาน')} · ช่วง ${x.low??x.k}–${x.high??x.k} kcal</div>${x.details?`<div class="hint" style="margin-top:5px">${esc(x.details)}</div>`:''}</div>`).join(""):"<div class='empty'>ยังไม่มีรายการอาหารวันนี้</div>"}</div>
 <div class="card"><div class="section-title">หลักการคำนวณ</div><div class="hint">ระบบให้ความสำคัญกับ “ปริมาณอาหารจริง” เช่น ข้าว ไข่ เนื้อสัตว์ ผัก และน้ำมัน มากกว่าการเดาจากน้ำหนักตัวหรือความรู้สึกอิ่มของคนกิน เพราะคนสองคนอาจอิ่มจากอาหารจานเดียวกันไม่เท่ากัน แต่แคลอรี่ของอาหารจานนั้นไม่ได้เปลี่ยนตามน้ำหนักตัว</div><div class="hint" style="margin-top:10px">ฐานข้อมูลอ้างอิงแนวคิดจาก Thai Food Composition Database ของสถาบันโภชนาการ ม.มหิดล และ FoodData Central ของ USDA โดยใช้ค่าเฉลี่ย/ช่วงประมาณการและเผื่อความไม่แน่นอนจากสูตรและปริมาณน้ำมัน</div></div>`;
}
function addFoodHint(t){const el=document.getElementById('fd');el.value=(el.value?el.value+' ':'')+t;previewFood();el.focus()}
function setGoal(){db.calGoal=Number(document.getElementById("goal").value)||2000;save();pageFood()}
function addFood(){const name=document.getElementById("fn").value.trim();if(!name)return alert("กรอกชื่ออาหาร");const x=estimate(name,document.getElementById("fq").value,document.getElementById("fd").value);x.unit=document.getElementById('fu').value;x.date=document.getElementById("fdview").value||today();db.foods.push(x);save();pageFood();}
function pageWeight(){
 const list=[...db.weights].sort((a,b)=>b.date.localeCompare(a.date)), last=list[0];
 let bmi=last&&db.height?last.kg/((db.height/100)**2):null;
 document.getElementById("content").innerHTML=`<h1>น้ำหนัก</h1><div class="date">ติดตามแนวโน้มและเป้าหมาย</div>
 <div class="grid2"><div class="card stat"><div class="label">น้ำหนักล่าสุด</div><div class="big">${last?last.kg+" kg":"—"}</div></div><div class="card stat"><div class="label">BMI</div><div class="big">${bmi?bmi.toFixed(1):"—"}</div></div></div>
 <div class="card" style="--accent:var(--weight)"><div class="section-title">ข้อมูลส่วนตัว</div><label>ส่วนสูง (cm)</label><input id="height" type="number" value="${db.height??""}" placeholder="เช่น 175"><button class="ghost" onclick="setHeight()" style="margin-top:8px">บันทึกส่วนสูง</button></div>
 <div class="card" style="--accent:var(--weight)"><div class="section-title">บันทึกน้ำหนัก</div><label>น้ำหนัก (kg)</label><input id="kg" type="number" step=".1" placeholder="เช่น 70.5"><label>วันที่</label>${dateField("wd",today())}<button class="primary" onclick="addWeight()">บันทึกน้ำหนัก</button></div>
 <div class="card" style="--accent:var(--weight)"><div class="section-title">ประวัติการชั่ง</div>${list.length?list.map(x=>`<div class="entry"><div class="row"><b>${fmtDate(x.date)}</b><b>${x.kg} kg</b></div></div>`).join(""):"<div class='empty'>ยังไม่มีข้อมูล</div>"}</div>`;
}
function setHeight(){db.height=Number(document.getElementById("height").value)||null;save();pageWeight()}
function addWeight(){const kg=Number(document.getElementById("kg").value);if(!kg)return alert("กรอกน้ำหนัก");db.weights.push({kg,date:document.getElementById("wd").value});save();pageWeight()}
function render(p){document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.page===p));({home:pageHome,money:pageMoney,food:pageFood,weight:pageWeight}[p])();initDateFields();}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>render(b.dataset.page));
document.getElementById("quick").onclick=()=>{render("money");setTimeout(()=>document.getElementById("tn")?.focus(),50)};
render("home");
</script>
</body>
</html>
